<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jinzhou · vT Official WuWa Universe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Cormorant+Garamond:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="bg"></div><canvas id="motes"></canvas>
<button id="burger" aria-label="Open menu" aria-expanded="false"><i></i><i></i><i></i></button>
<aside id="drawer" aria-hidden="true"><nav id="nav"></nav><p class="brand">vT Official</p></aside>
<div id="scrim"></div>
<header id="panel">
  <img class="av" src="assets/bot/avatar.jpg" alt="Bot avatar">
  <div class="meta">
    <b id="bname">Unavailable</b>
    <span><i id="dot" class="dot"></i><span id="bstatus">Connecting…</span> · <span id="bsrv">—</span> servers</span>
    <a id="bact" hidden target="_blank" rel="noopener"></a>
  </div>
</header>
<main id="view" tabindex="-1"></main>
<div id="abby" aria-label="Abby">
  <button id="abbyBtn" aria-label="Talk to Abby"><img src="assets/abby/abby.gif" alt="Abby"></button>
</div>
<section id="bubble" hidden>
  <header><span>Abby</span><button id="bclose" aria-label="Close chat">×</button></header>
  <div id="log" aria-live="polite"></div>
  <form id="chat" autocomplete="off"><input id="q" maxlength="400" placeholder="Ask about the WuWa bot…"><button>Send</button></form>
  <i class="t1"></i><i class="t2"></i>
</section>
<script src="js/app.js"></script>
</body>
</html>
